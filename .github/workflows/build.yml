name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compile mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Print environment
        run: |
          java -version
          bash ./gradlew --version

      # Called through bash so the build does not depend on gradlew carrying the exec bit.
      - name: Build
        run: bash ./gradlew build --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/
          ls -lh dist

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: yucca-${{ github.sha }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30
